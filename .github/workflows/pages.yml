name: Deploy dashboard to GitHub Pages

# The dashboard HTML is rendered and committed to the repository by the VPS
# publisher (see README.md).  This workflow publishes that static site with
# the official GitHub Pages actions.
#
# A custom Actions workflow is not subject to the legacy 10-builds-per-hour
# Pages limit, so a 20-minute publication cadence is fine.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
